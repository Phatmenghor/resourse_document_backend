# ─────────────────────────────────────────────────────────────
#  Application service — Spring Boot
#  All config is read from application-{profile}.yaml (no env block).
#  Container runs on port 8080, exposed to host on port 6060.
#  Start with:  docker compose -f docker-compose.app.yml up -d --build
# ─────────────────────────────────────────────────────────────
services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resource-service
    restart: unless-stopped
    ports:
      - "6060:8080"
    volumes:
      - /Users/shadow/Freelance/E_MENU/resourse_document_backend/storage:/app/storage
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
