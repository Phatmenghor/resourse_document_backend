spring:
  application:
    name: notification-service
  profiles:
    active: local

  # ── Shared datasource (connection pool only — url/user/pass in profile) ──
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── Redis (host/port in profile) ──
  data:
    redis:
      timeout: 2000ms

  # ── Multipart limits ──
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

  # ── Kafka shared settings (bootstrap-servers in profile) ──
  kafka:
    consumer:
      group-id: notification-gateway-group
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
      retries: 3
    properties:
      max.request.size: 52428800
      message.max.bytes: 52428800
      fetch.message.max.bytes: 52428800

# ── Server ──
server:
  port: 8080

# ── JWT ──
jwt:
  secret: da2bd42bef8f9f957d647ed13571dadd5b59c7055fb723eacdb05154878da17d77d3180385fc232cab38bded0fc7dbda0d439cc275e91164ade266d64d50633bc7
  expiration: 99999999999999999

# ── App init ──
app:
  name: "Resource Gateway Service"
  version: "1.0.0"
  init:
    create-admin: true
    admin-email: "phatmenghor19@gmail.com"
    admin-password: "88889999"

# ── Notification Gateway ──
notification:
  gateway:
    enabled: true
    max-recipients-per-request: 100
  kafka:
    topics:
      telegram: telegram-notifications
      email: email-notifications
      logs: notification-logs
  telegram:
    api-url: https://api.telegram.org/bot
    timeout: 5000
  email:
    timeout: 10000

# ── Resource Kafka topics (base-path/base-url in profile) ──
resource:
  kafka:
    topics:
      upload: resource-file-upload
      delete: resource-file-delete
    consumer:
      group-id: resource-file-group

# ── Swagger ──
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# ── Actuator ──
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# ── Logging ──
logging:
  level:
    # Suppress noisy Kafka internals (rebalance, offset reset, partition assignment)
    org.apache.kafka.clients.consumer.internals: WARN
    org.apache.kafka.clients.consumer: WARN
    org.apache.kafka.clients.producer: WARN
    org.apache.kafka.clients: WARN
    org.apache.kafka.common: WARN
    # Suppress Hibernate SQL constraint detail logs (keep app-level errors)
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: ERROR
    # Suppress Spring Kafka listener verbose output
    org.springframework.kafka.listener: WARN
    org.springframework.kafka: WARN
